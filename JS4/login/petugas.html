<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIMPUS-Mini | Login Petugas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
  <header class="navbar navbar-expand-md navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand fw-semibold" href="index.html">SIMPUS-Mini</a>
      </nav>
    </div>
  </header>

  <main class="container my-4">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <section class="card shadow-sm mb-4">
          <div class="card-body">
            <h2 class="card-title mb-1 text-primary">Login Petugas</h2>
            <p class="text-danger small mb-3">* Wajib diisi</p>

            <form method="POST" action="dashboard.html">
              <div class="mb-3">
                <label for="username" class="form-label fw-semibold">Username <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="username" name="username" placeholder="Masukkan username"
                  required>
              </div>

              <div class="mb-3">
                <label for="password" class="form-label fw-semibold">Password <span class="text-danger">*</span></label>
                <input type="password" class="form-control" id="password" name="password"
                  placeholder="Masukkan password" required>
              </div>

              <div class="d-grid gap-2">
                <button type="submit" class="btn btn-primary">Masuk</button>
              </div>
            </form>

            <div class="text-center mt-3">
              <p class="small text-muted mb-0">Belum punya akun? <a href="registrasi.html">Daftar di sini</a></p>
            </div>
          </div>
        </section>
      </div>
    </div>
  </main>

  <footer class="text-center py-3">
    <p class="mb-0">&copy; 2026 SIMPUS-Mini &mdash; Jobsheet 1</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
