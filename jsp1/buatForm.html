<html>

<head>
    <title>Membuat Form</title>
</head>

<body>
    <form method="GET" action="gambar.html">
        <h4>FORM</h4>

        <br><br>
        <input type="text" name="var2" size="30" VALUE="Enter your address here.">

        <b>Are you a student?</b>
        <input type="checkbox" name="var3">

        <input type="radio" name="var4" value="r1"> 10-15

        <input type="radio" name="var4" value="r3"> 21-25

        <input type="checkbox" name="vehicle3" value="Boat"> I have a boat

        <input type="checkbox" name="vehicle4" value="Plane" checked> I have a plane
        <br><br>

        <br>
        <select name="var6" size="1">
            <option value="BG">Bulgaria
            <option value="UK">United Kingdom

        </select>
        <br><br>
        <b>Enter your private code</b>
        <input type="password" name="var8" size="15">
        <br><br>
        <b>Enter your comment</b>

        <textarea name="var9" rows="4" cols="40">Fill this area</textarea>

</html>
